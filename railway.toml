[build]
builder = "nixpacks"

[deploy]
startCommand = "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# Cron job: roda às 23h nos dias de sorteio (Seg/Qua/Sex, horário de Brasília = UTC-3 → 02h UTC)
# Para adicionar no Railway: Settings → Cron Jobs → "0 2 * * 2,4,6"
# Comando: python -m backend.cron_worker
